[project]
name = "ai-portfolio-backend"
version = "0.1.0"
description = "AI Portfolio Chatbot backend (FastAPI + LangGraph + RAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "python-dotenv>=1.0.1",
  "litellm>=1.55.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31.0",
  "alembic>=1.19.1",
  "pgvector>=0.5.0",
  "pymupdf>=1.28.2",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.32",
  "redis>=8.1.0",
  "tiktoken>=0.13.0",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
